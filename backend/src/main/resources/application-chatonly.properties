# No database — Gemini chat API only (used with ChatOnlyApplication + profile chatonly)
# Windows: if GEMINI_API_URL or GEMINI_API_KEY is set as a system/user env var, it overrides values below.
server.port=8080

spring.sql.init.mode=never

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
