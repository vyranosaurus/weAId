<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>weAId - AI Triage Chat</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "secondary": "#5d5f5f",
                        "surface-variant": "#f7ddd8",
                        "secondary-fixed": "#e2e2e2",
                        "tertiary-fixed-dim": "#bcc2ff",
                        "surface-container": "#ffe9e6",
                        "on-primary-container": "#ff8371",
                        "inverse-primary": "#ffb4a8",
                        "surface-container-low": "#fff0ee",
                        "on-tertiary-fixed-variant": "#1830c2",
                        "outline": "#8e706c",
                        "on-secondary-fixed": "#1a1c1c",
                        "surface-tint": "#b22b1d",
                        "secondary-container": "#dcdddd",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#5f6161",
                        "on-secondary-fixed-variant": "#454747",
                        "on-primary-fixed-variant": "#8f0f07",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#410000",
                        "tertiary": "#00137f",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "outline-variant": "#e2bfb9",
                        "background": "#fff8f6",
                        "surface-bright": "#fff8f6",
                        "on-surface": "#261816",
                        "primary-fixed": "#ffdad4",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#000c61",
                        "tertiary-fixed": "#dfe0ff",
                        "primary-fixed-dim": "#ffb4a8",
                        "inverse-on-surface": "#ffedea",
                        "surface-container-highest": "#f7ddd8",
                        "on-surface-variant": "#5a413d",
                        "surface-container-high": "#fde2de",
                        "primary": "#570000",
                        "on-tertiary-container": "#94a0ff",
                        "error-container": "#ffdad6",
                        "surface-dim": "#eed4d0",
                        "surface": "#fff8f6",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-primary": "#ffffff",
                        "on-background": "#261816",
                        "tertiary-container": "#0021b9",
                        "inverse-surface": "#3d2d2a",
                        "primary-container": "#800000"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "unit": "8px",
                        "stack-md": "16px",
                        "gutter": "16px",
                        "container-padding": "20px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Montserrat"],
                        "label-bold": ["Montserrat"],
                        "display-lg": ["Montserrat"],
                        "body-lg": ["Montserrat"],
                        "body-md": ["Montserrat"],
                        "ai-signature": ["Montserrat"],
                        "display-md": ["Montserrat"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-bold": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "ai-signature": ["inherit", { "lineHeight": "inherit", "fontWeight": "900" }],
                        "display-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased pb-safe">
<!-- TopAppBar (Based on JSON, modified for inner page intent: linear/transactional) -->
<header class="bg-[#800000] text-white font-['Montserrat'] font-semibold tracking-tight rounded-b-[20px] w-full fixed top-0 z-50 shadow-xl shadow-[#800000]/10 flex justify-between items-center px-5 h-16 transition-transform">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="text-white hover:bg-white/10 p-2 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="smart_toy">smart_toy</span>
<span class="text-lg font-bold">weAId <span class="font-ai-signature drop-shadow-[0_0_8px_rgba(255,255,255,0.8)]">AI Assistant</span></span>
</div>
</div>
<button aria-label="Options" class="text-white hover:bg-white/10 p-2 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Chat Canvas -->
<main class="flex-1 overflow-y-auto pt-20 pb-24 px-container-padding flex flex-col gap-stack-md bg-[#F5F5F5]">
<!-- Disclaimer Pill -->
<div class="flex justify-center mt-stack-sm mb-stack-sm">
<div class="bg-surface-variant text-on-surface-variant font-label-bold text-label-bold px-4 py-2 rounded-full shadow-[0_2px_8px_rgba(128,0,0,0.05)] flex items-center gap-2 max-w-[90%] text-center">
<span class="material-symbols-outlined text-[16px]" data-icon="info">info</span>
<span>Hindi po ito doctor. Para sa emergency, tumawag sa 911.</span>
</div>
</div>
<!-- Chat History -->
<div class="flex flex-col gap-stack-lg">
<!-- User Message -->
<div class="flex justify-end">
<div class="bg-primary-container text-white font-body-md text-body-md px-4 py-3 rounded-2xl rounded-tr-sm max-w-[85%] shadow-[0_4px_12px_rgba(128,0,0,0.1)]">
                    Masakit po yung ulo ko at medyo nilalagnat.
                </div>
</div>
<!-- AI Message -->
<div class="flex justify-start">
<div class="flex gap-2 max-w-[90%]">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center shrink-0 shadow-sm mt-1">
<span class="material-symbols-outlined text-white text-[18px]" data-icon="smart_toy">smart_toy</span>
</div>
<div class="flex flex-col gap-2">
<div class="bg-white text-on-surface font-body-md text-body-md px-4 py-3 rounded-2xl rounded-tl-sm shadow-[0_4px_12px_rgba(128,0,0,0.04)]">
                            Nauunawaan ko. Upang mas matulungan kita, gaano na po katagal ninyong nararamdaman ito?
                        </div>
<!-- Interactive Chips -->
<div class="flex flex-wrap gap-2 mt-1">
<button class="bg-white border border-secondary-fixed text-primary font-body-md text-body-md px-4 py-2 rounded-full shadow-[0_2px_6px_rgba(128,0,0,0.02)] active:scale-95 transition-all hover:border-primary-container">
                                Today lang
                            </button>
<button class="bg-white border border-secondary-fixed text-primary font-body-md text-body-md px-4 py-2 rounded-full shadow-[0_2px_6px_rgba(128,0,0,0.02)] active:scale-95 transition-all hover:border-primary-container">
                                1-3 days
                            </button>
<button class="bg-white border border-secondary-fixed text-primary font-body-md text-body-md px-4 py-2 rounded-full shadow-[0_2px_6px_rgba(128,0,0,0.02)] active:scale-95 transition-all hover:border-primary-container">
                                Mahigit isang linggo
                            </button>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Input Area (Replacing BottomNavBar due to transactional intent) -->
<div class="fixed bottom-0 w-full bg-white border-t border-secondary-fixed p-4 pb-safe z-40 shadow-[0_-4px_12px_rgba(128,0,0,0.04)]">
<div class="flex items-center gap-3 max-w-3xl mx-auto">
<button aria-label="Add attachment" class="p-2 text-secondary hover:bg-surface-variant rounded-full transition-colors shrink-0">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
</button>
<div class="flex-1 relative">
<input class="w-full bg-background border border-secondary-fixed rounded-xl px-4 py-3 pr-10 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" placeholder="Mag-type ng inyong nararamdaman..." type="text"/>
<button aria-label="Send message" class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-primary-container hover:bg-surface-variant rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
<button aria-label="Voice input" class="w-12 h-12 bg-primary-container text-white rounded-full flex items-center justify-center shrink-0 shadow-[0_4px_12px_rgba(128,0,0,0.15)] active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</button>
</div>
</div>
</body></html>
