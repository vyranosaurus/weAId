<body class="bg-[#f5f5f5] min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Mobile Screen Container -->
<main class="w-full max-w-[390px] h-[844px] bg-[#f5f5f5] rounded-3xl shadow-2xl overflow-y-auto flex flex-col relative border-[8px] border-black">
<!-- Top Hero Section -->
<header class="bg-primary-container text-on-primary rounded-b-[20px] px-container-padding pt-16 pb-10 relative overflow-hidden shrink-0 z-10 shadow-lg">
<!-- Decorative circle -->
<div class="absolute -bottom-12 -right-12 w-40 h-40 bg-white/10 rounded-full blur-sm"></div>
<!-- Brand Logo -->
<div class="text-[28px] font-ai-signature text-ai-signature tracking-tighter mb-8 relative z-10">
        we<span class="text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.7)]">AI</span>d
      </div>
<!-- Header Copy -->
<h1 class="font-display-md text-display-md mb-3 relative z-10">Manage your hospital. Move your queue.</h1>
<p class="font-body-md text-body-md opacity-90 relative z-10">weAId connects every patient at your gate to the right care, faster.</p>
</header>
<!-- Content Section -->
<section class="flex-1 px-container-padding pt-stack-lg pb-8 flex flex-col z-0 -mt-2">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-[12px] p-6 shadow-[0_4px_12px_rgba(128,0,0,0.04)] relative z-20">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-1">Hospital Partner Login</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-6">Sign in to your hospital admin dashboard.</p>
<form class="flex flex-col gap-stack-md">
<!-- Hospital Selector -->
<div class="flex flex-col gap-unit">
<label class="font-label-bold text-label-bold text-on-surface uppercase">Hospital</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-secondary-fixed rounded-[12px] px-4 py-3 font-body-md text-body-md placeholder:text-secondary focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" placeholder="Search hospital..." type="text"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-secondary pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-unit">
<label class="font-label-bold text-label-bold text-on-surface uppercase">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-secondary-fixed rounded-[12px] px-4 py-3 font-body-md text-body-md placeholder:text-secondary focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" placeholder="admin@hospital.com" type="email"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-unit">
<label class="font-label-bold text-label-bold text-on-surface uppercase">Password</label>
<input class="w-full bg-surface-container-lowest border border-secondary-fixed rounded-[12px] px-4 py-3 font-body-md text-body-md placeholder:text-secondary focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" placeholder="••••••••" type="password"/>
</div>
<!-- Extras Row -->
<div class="flex items-center justify-between mt-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded text-primary-container border-secondary-fixed focus:ring-primary-container w-4 h-4 transition-colors" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-body-md text-body-md font-semibold text-primary-container hover:underline" href="#">Forgot password?</a>
</div>
<!-- Actions -->
<button class="mt-4 w-full bg-primary-container text-on-primary font-label-bold text-label-bold uppercase tracking-wider py-4 rounded-[50px] hover:bg-primary transition-colors shadow-sm" type="button">
            Sign in
          </button>
<div class="flex items-center gap-4 my-2">
<div class="h-[1px] bg-secondary-fixed flex-1"></div>
<span class="font-body-md text-body-md text-secondary">or</span>
<div class="h-[1px] bg-secondary-fixed flex-1"></div>
</div>
<button class="w-full border-[1.5px] border-primary-container text-primary-container font-label-bold text-label-bold uppercase tracking-wider py-[14px] rounded-[50px] hover:bg-surface-container-low transition-colors flex justify-center items-center gap-2" type="button">
            Sign in with PhilHealth ID
          </button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-auto pt-8 pb-4 text-center flex flex-col gap-3">
<a class="font-body-md text-body-md font-semibold text-primary-container hover:underline" href="#">Not yet a partner? Request access</a>
<div class="font-body-md text-body-md text-secondary text-[12px] flex items-center justify-center gap-1.5 opacity-80">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
          Protected by weAId Trust.
        </div>
</div>
