<body class="bg-[#F5F5F5] text-on-surface antialiased min-h-screen flex flex-col pb-[100px]">
<!-- TopAppBar (Transactional/Task-focused, overriding default shell visibility per rules for a 'Detail & Scheduling' screen, but implementing a back-nav variant) -->
<header class="bg-[#800000] text-white font-headline-sm rounded-b-[20px] w-full fixed top-0 z-50 shadow-xl shadow-[#800000]/10 flex justify-between items-center px-5 h-16 w-full">
<button class="text-white hover:bg-white/10 active:scale-95 transition-transform p-2 rounded-full -ml-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<span class="text-2xl font-black text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.6)] font-ai-signature">weAId</span>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="flex-grow pt-16">
<!-- Hero Section -->
<div class="relative h-[250px] w-full bg-surface-container-high rounded-b-xl overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center" data-alt="modern hospital building exterior with clear blue sky and bright lighting" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDXromtyTNoXmGBqLkesRTPZzjDjVxjJQTRmxUZee72MTjfPJf8DsQXFiMbZAfHhkB-hN3R8dL_ije2j9-DRTkZINakWk8G9mBk3mL8y8NBsxucoPOjU2KcorMHg0yfQDYumC3PZXTW5I6sf4qCtMDIbi0EZWxsoblYrA8JaJqeSFJIaCuGLs0iNfnx4MSDHArcDSHUQarqpoh2HH1kzO5GNDjdExDnhiO2o8cj5J1LCzfD2cjuj9AHdfyLD6WYOdPHbVt-TYV5EJq-');"></div>
<div class="absolute inset-0 bg-gradient-to-t from-primary-container/90 to-transparent"></div>
<div class="absolute bottom-0 left-0 w-full p-container-padding flex flex-col gap-stack-sm">
<h1 class="font-display-md text-display-md text-white">St. Luke's Medical Center</h1>
<div class="flex items-center gap-2 text-white/90 font-body-md text-body-md">
<span class="material-symbols-outlined text-[18px]">location_on</span>
<span>Quezon City, Metro Manila</span>
</div>
</div>
</div>
<!-- Content Canvas -->
<div class="px-container-padding mt-stack-md flex flex-col gap-stack-lg">
<!-- Tabs (Bento Style) -->
<div class="grid grid-cols-4 gap-unit bg-white p-unit rounded-xl shadow-[0_4px_12px_rgba(128,0,0,0.04)]">
<button class="py-2 text-center font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wide">Overview</button>
<button class="py-2 text-center font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wide">Services</button>
<button class="py-2 text-center font-label-bold text-label-bold text-primary-container bg-surface-container rounded-lg uppercase tracking-wide relative">
                    Iskedyul
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-4 h-[2px] bg-primary-container rounded-t-sm"></div>
</button>
<button class="py-2 text-center font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wide">Reviews</button>
</div>
<!-- Date Selector -->
<div class="flex flex-col gap-stack-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Pumili ng Araw</h2>
<div class="flex gap-stack-sm overflow-x-auto pb-2 -mx-container-padding px-container-padding snap-x">
<div class="snap-center shrink-0 w-[72px] h-[80px] bg-white border border-secondary-fixed rounded-xl flex flex-col items-center justify-center gap-1 shadow-[0_4px_12px_rgba(128,0,0,0.04)]">
<span class="font-label-bold text-label-bold text-on-surface-variant">LUN</span>
<span class="font-display-md text-display-md text-on-surface">12</span>
</div>
<div class="snap-center shrink-0 w-[72px] h-[80px] bg-primary-container rounded-xl flex flex-col items-center justify-center gap-1 shadow-[0_4px_12px_rgba(128,0,0,0.1)] ring-2 ring-primary-container ring-offset-2">
<span class="font-label-bold text-label-bold text-white/80">MAR</span>
<span class="font-display-md text-display-md text-white">13</span>
</div>
<div class="snap-center shrink-0 w-[72px] h-[80px] bg-white border border-secondary-fixed rounded-xl flex flex-col items-center justify-center gap-1 shadow-[0_4px_12px_rgba(128,0,0,0.04)]">
<span class="font-label-bold text-label-bold text-on-surface-variant">MIY</span>
<span class="font-display-md text-display-md text-on-surface">14</span>
</div>
<div class="snap-center shrink-0 w-[72px] h-[80px] bg-white border border-secondary-fixed rounded-xl flex flex-col items-center justify-center gap-1 shadow-[0_4px_12px_rgba(128,0,0,0.04)]">
<span class="font-label-bold text-label-bold text-on-surface-variant">HUW</span>
<span class="font-display-md text-display-md text-on-surface">15</span>
</div>
<div class="snap-center shrink-0 w-[72px] h-[80px] bg-surface-container-low border border-surface-variant rounded-xl flex flex-col items-center justify-center gap-1 opacity-50">
<span class="font-label-bold text-label-bold text-outline">BIY</span>
<span class="font-display-md text-display-md text-outline">16</span>
</div>
</div>
</div>
<!-- Wait Time Info Box -->
<div class="bg-surface-container border border-surface-variant rounded-xl p-stack-md flex items-start gap-stack-sm shadow-[0_4px_12px_rgba(128,0,0,0.04)]">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">timer</span>
<div>
<p class="font-headline-sm text-headline-sm text-on-surface text-[16px] leading-[20px]">Estimated wait on arrival: ~25 min</p>
<p class="font-body-md text-body-md text-on-surface-variant text-[12px] mt-1">Based on current ER traffic and selected time slot.</p>
</div>
</div>
<!-- Time Slots Grid -->
<div class="flex flex-col gap-stack-sm mb-stack-lg">
<h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center justify-between">
<span>Available Slots</span>
<span class="font-body-md text-body-md text-primary-container bg-surface-container px-2 py-1 rounded-full text-[12px]">Morning</span>
</h2>
<div class="grid grid-cols-3 gap-unit">
<button class="bg-white border border-secondary-fixed rounded-xl py-3 font-body-md text-body-md text-on-surface shadow-[0_4px_12px_rgba(128,0,0,0.04)]">08:00 AM</button>
<button class="bg-white border border-secondary-fixed rounded-xl py-3 font-body-md text-body-md text-on-surface shadow-[0_4px_12px_rgba(128,0,0,0.04)]">08:30 AM</button>
<button class="bg-surface-container-low border border-surface-variant rounded-xl py-3 font-body-md text-body-md text-outline opacity-50 line-through">09:00 AM</button>
<button class="bg-primary-container rounded-xl py-3 font-body-md text-body-md text-white font-semibold shadow-[0_4px_12px_rgba(128,0,0,0.1)] ring-2 ring-primary-container ring-offset-1">09:30 AM</button>
<button class="bg-white border border-secondary-fixed rounded-xl py-3 font-body-md text-body-md text-on-surface shadow-[0_4px_12px_rgba(128,0,0,0.04)]">10:00 AM</button>
<button class="bg-white border border-secondary-fixed rounded-xl py-3 font-body-md text-body-md text-on-surface shadow-[0_4px_12px_rgba(128,0,0,0.04)]">10:30 AM</button>
</div>
</div>
</div>
</main>
<!-- Sticky Bottom Action -->
<div class="fixed bottom-0 w-full p-container-padding bg-white/90 backdrop-blur-md border-t border-secondary-fixed shadow-[0_-4px_20px_rgba(128,0,0,0.08)] pb-safe z-40">
<button class="w-full bg-primary-container text-white font-headline-sm text-headline-sm py-4 rounded-full shadow-[0_4px_12px_rgba(128,0,0,0.2)] active:scale-[0.98] transition-transform">
            Kunin ang slot — Libre
        </button>
</div>
